<svg fill="none" width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="240" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="35" y="40" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="20" font-weight="700">⚙️ Tech Stack &amp; Tools</text>
  <line x1="35" y1="52" x2="965" y2="52" stroke="#334155" stroke-width="1"/>

  <!-- Row 1: Languages & Frontend -->
  <g transform="translate(35, 70)">
    <!-- Languages Category -->
    <text x="0" y="20" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">LANGUAGES</text>
    <g transform="translate(0, 30)">
      <!-- Java -->
      <rect width="80" height="42" rx="8" fill="url(#tileBg)" stroke="#ffaa00" stroke-width="1.2"/>
      <text x="40" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">☕ Java</text>

      <!-- Python -->
      <rect x="90" width="90" height="42" rx="8" fill="url(#tileBg)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="135" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">🐍 Python</text>

      <!-- JS -->
      <rect x="190" width="110" height="42" rx="8" fill="url(#tileBg)" stroke="#facc15" stroke-width="1.2"/>
      <text x="245" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">⚡ JavaScript</text>

      <!-- SQL -->
      <rect x="310" width="75" height="42" rx="8" fill="url(#tileBg)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="347" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">🗄️ SQL</text>
    </g>

    <!-- Frontend Category -->
    <text x="440" y="20" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">FRONTEND</text>
    <g transform="translate(440, 30)">
      <!-- HTML5 -->
      <rect width="90" height="42" rx="8" fill="url(#tileBg)" stroke="#f97316" stroke-width="1.2"/>
      <text x="45" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">🌐 HTML5</text>

      <!-- CSS3 -->
      <rect x="100" width="85" height="42" rx="8" fill="url(#tileBg)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="142" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">🎨 CSS3</text>
    </g>

    <!-- Backend Category -->
    <text x="660" y="20" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">BACKEND &amp; DB</text>
    <g transform="translate(660, 30)">
      <!-- MySQL -->
      <rect width="95" height="42" rx="8" fill="url(#tileBg)" stroke="#0284c7" stroke-width="1.2"/>
      <text x="47" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">🐬 MySQL</text>

      <!-- Java Backend -->
      <rect x="105" width="120" height="42" rx="8" fill="url(#tileBg)" stroke="#ffaa00" stroke-width="1.2"/>
      <text x="165" y="26" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">☕ Java Backend</text>
    </g>
  </g>

  <!-- Row 2: Tools Category -->
  <g transform="translate(35, 155)">
    <text x="0" y="15" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">TOOLS &amp; PRODUCTIVITY</text>
    <g transform="translate(0, 25)">
      <rect width="75" height="38" rx="8" fill="url(#tileBg)" stroke="#ef4444" stroke-width="1.2"/>
      <text x="37" y="24" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">Git</text>

      <rect x="85" width="95" height="38" rx="8" fill="url(#tileBg)" stroke="#f8fafc" stroke-width="1.2"/>
      <text x="132" y="24" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">GitHub</text>

      <rect x="190" width="105" height="38" rx="8" fill="url(#tileBg)" stroke="#0284c7" stroke-width="1.2"/>
      <text x="242" y="24" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">VS Code</text>

      <rect x="305" width="85" height="38" rx="8" fill="url(#tileBg)" stroke="#a855f7" stroke-width="1.2"/>
      <text x="347" y="24" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">Figma</text>

      <rect x="400" width="75" height="38" rx="8" fill="url(#tileBg)" stroke="#2563eb" stroke-width="1.2"/>
      <text x="437" y="24" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">Jira</text>
    </g>
  </g>
</svg>

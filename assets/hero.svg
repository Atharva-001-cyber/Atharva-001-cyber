<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030711"/>
    <stop offset="0.55" stop-color="#07111b"/>
    <stop offset="1" stop-color="#160b24"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07101a"/>
    <stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#13a8ff"/>
    <stop offset="1" stop-color="#7c5cff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#7aa2c9" stroke-opacity=".07"/>
  </pattern>
</defs>

<rect width="1200" height="430" rx="20" fill="url(#bg)"/>
<rect width="1200" height="430" rx="20" fill="url(#grid)"/>

<!-- atmospheric light -->
<ellipse cx="1010" cy="110" rx="190" ry="150" fill="#713cff" opacity=".10" filter="url(#glow)"/>
<ellipse cx="720" cy="350" rx="300" ry="90" fill="#00a8ff" opacity=".07" filter="url(#glow)"/>

<!-- left copy -->
<text x="58" y="70" fill="#e8f1ff" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2">HI THERE! 👋</text>
<text x="58" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Atharva</text>
<text x="58" y="180" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Ranjan <tspan fill="#79b9ff">Soni</tspan></text>
<text x="60" y="213" fill="#d8e7f8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">JAVA DEVELOPER  |  DSA ENTHUSIAST  |  BUILDING REAL SOLUTIONS</text>
<text x="60" y="246" fill="#d0dae8" font-family="Arial, Helvetica, sans-serif" font-size="15">I love turning ideas into practical software, solving</text>
<text x="60" y="269" fill="#d0dae8" font-family="Arial, Helvetica, sans-serif" font-size="15">real-world problems and continuously learning.</text>

<!-- buttons -->
<rect x="60" y="294" width="145" height="42" rx="7" fill="#0b8df0"/>
<text x="79" y="320" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Let's Connect</text>
<text x="183" y="320" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18">→</text>

<rect x="216" y="294" width="143" height="42" rx="7" fill="#07111c" stroke="#52677e"/>
<circle cx="240" cy="315" r="9" fill="#fff"/>
<text x="236" y="319" fill="#07111c" font-family="Arial" font-size="11" font-weight="700">●</text>
<text x="255" y="320" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13">View My Work</text>

<!-- desk shadow -->
<ellipse cx="870" cy="363" rx="290" ry="28" fill="#000" opacity=".65" filter="url(#shadow)"/>

<!-- back monitor -->
<rect x="875" y="78" width="242" height="145" rx="8" fill="#111a24" stroke="#37485b" stroke-width="3"/>
<rect x="886" y="89" width="220" height="122" rx="3" fill="url(#screen)"/>
<circle cx="900" cy="101" r="3" fill="#ff5f57"/>
<circle cx="911" cy="101" r="3" fill="#ffbd2e"/>
<circle cx="922" cy="101" r="3" fill="#28c840"/>
<g font-family="monospace" font-size="9">
<text x="900" y="120" fill="#62d9ff">public class Main {</text>
<text x="910" y="135" fill="#b995ff"> public static void main</text>
<text x="910" y="150" fill="#e8f1ff"> (String[] args) {</text>
<text x="920" y="165" fill="#70e39a"> System.out.println</text>
<text x="920" y="180" fill="#ffd66b"> ("build();");</text>
<text x="910" y="195" fill="#e8f1ff"> }</text>
<text x="900" y="207" fill="#62d9ff">}</text>
</g>
<path d="M980 223v22M960 245h40" stroke="#4c5e70" stroke-width="5"/>

<!-- desk -->
<path d="M650 325 L1135 325 L1180 385 L620 385 Z" fill="#171b20" stroke="#3d434b" stroke-width="2"/>
<path d="M640 385H1170" stroke="#090b0f" stroke-width="12"/>

<!-- lamp -->
<path d="M1030 210 Q1050 175 1080 155" fill="none" stroke="#aab2ba" stroke-width="8"/>

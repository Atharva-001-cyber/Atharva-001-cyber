<path d="M700 170 Q703 158 716 158 H1000 Q1013 158 1015 171 L1015 322 H700 Z" fill="#0b1118" stroke="#526271" stroke-width="3"/>
<rect x="718" y="177" width="279" height="127" rx="3" fill="url(#screen)"/>
<circle cx="858" cy="167" r="3" fill="#53687b"/>
<g font-family="monospace" font-size="9">
<text x="730" y="194" fill="#6be2ff">import java.util.*;</text>
<text x="730" y="209" fill="#d7a5ff">class Developer {</text>
<text x="742" y="224" fill="#fff">void build() {</text>
<text x="754" y="239" fill="#7fe7a2"> solveProblems();</text>
<text x="754" y="254" fill="#ffcf67"> learnJava();</text>
<text x="754" y="269" fill="#6be2ff"> shipProjects();</text>
<text x="742" y="284" fill="#fff">}</text>
<text x="730" y="298" fill="#d7a5ff">}</text>
</g>
<path d="M676 322 Q700 330 718 330 H1008 Q1028 330 1047 322 L1080 355 Q1087 365 1071 367 H650 Q636 365 643 355 Z" fill="#242c35" stroke="#4c5965" stroke-width="2"/>
<rect x="810" y="338" width="112" height="12" rx="5" fill="#11171e" stroke="#485565"/>

<!-- notebook and mug -->
<rect x="1060" y="275" width="82" height="55" rx="4" fill="#eee9dc" transform="rotate(-5 1060 275)"/>
<text x="1070" y="297" fill="#222" font-family="Arial" font-size="9" transform="rotate(-5 1060 275)">CODE</text>
<text x="1070" y="311" fill="#222" font-family="Arial" font-size="9" transform="rotate(-5 1060 275)">LEARN</text>

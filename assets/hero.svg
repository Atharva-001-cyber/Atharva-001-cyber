<path d="M985 229 L1020 229 L1032 246 L974 246 Z" fill="#f3b45d"/>
<ellipse cx="1002" cy="246" rx="48" ry="17" fill="#f3b45d" opacity=".16" filter="url(#glow)"/>

<!-- plant -->
<rect x="748" y="246" width="54" height="60" rx="9" fill="#9b633d"/>
<path d="M774 247 C745 215 760 185 780 228 C775 190 805 180 796 230 C817 204 832 222 802 250" fill="#3f8f58"/>
<path d="M777 250 C755 222 752 205 770 235M789 247C803 220 809 206 801 237" stroke="#78bd77" stroke-width="3" fill="none"/>


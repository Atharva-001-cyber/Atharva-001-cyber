<path d="M1080 305h55v45q0 13-13 13h-29q-13 0-13-13z" fill="#17212b" stroke="#596b7d" stroke-width="2"/>
<path d="M1135 318q28-3 22 18q-3 13-22 10" fill="none" stroke="#596b7d" stroke-width="5"/>
<text x="1088" y="325" fill="#dbe8f4" font-family="Arial" font-size="8">CODE</text>
<text x="1088" y="337" fill="#dbe8f4" font-family="Arial" font-size="8">LEARN</text>
<text x="1088" y="349" fill="#dbe8f4" font-family="Arial" font-size="8">BUILD</text>

<!-- bottom accent -->
<rect x="58" y="380" width="300" height="2" fill="url(#blue)"/>
<text x="378" y="386" fill="#8ba2b9" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3">CODE • LEARN • SOLVE • BUILD</text>
<rect x="650" y="380" width="450" height="2" fill="url(#blue)" opacity=".75"/>

</svg>

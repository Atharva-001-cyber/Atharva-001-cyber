<svg fill="none" width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="230" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="30" y="32" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="16" font-weight="700">🧩 DSA Journey &amp; Skill Matrix</text>
  <text x="350" y="32" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">Daily Java Practice | Repo: <tspan fill="#ffaa00">Atharva-001-cyber/LeetCode_Problem</tspan></text>
  <line x1="30" y1="42" x2="970" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- Left Column (Topics 1 to 5) -->
  <g transform="translate(30, 55)" font-family="'Fira Code', monospace" font-size="12">
    <!-- Searching -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🔍 Searching</text>
      <rect x="140" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="140" y="4" width="180" height="14" rx="7" fill="url(#barGreen)"/>
      <text x="330" y="16" fill="#10b981" font-weight="700">100% (Done)</text>
    </g>

    <!-- Arrays -->
    <g transform="translate(0, 32)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🔢 Arrays</text>
      <rect x="140" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="140" y="4" width="126" height="14" rx="7" fill="url(#barBlue)"/>
      <text x="330" y="16" fill="#00f0ff" font-weight="700">70% (Active)</text>
    </g>

    <!-- Strings -->
    <g transform="translate(0, 64)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🔤 Strings</text>
      <rect x="140" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="140" y="4" width="126" height="14" rx="7" fill="url(#barBlue)"/>
      <text x="330" y="16" fill="#00f0ff" font-weight="700">70% (Active)</text>
    </g>

    <!-- Linked Lists -->
    <g transform="translate(0, 96)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🔗 Linked Lists</text>
      <rect x="140" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="140" y="4" width="126" height="14" rx="7" fill="url(#barBlue)"/>
      <text x="330" y="16" fill="#00f0ff" font-weight="700">70% (Active)</text>
    </g>

    <!-- Stacks & Queues -->
    <g transform="translate(0, 128)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🥞 Stacks/Queues</text>
      <rect x="140" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="140" y="4" width="126" height="14" rx="7" fill="url(#barBlue)"/>
      <text x="330" y="16" fill="#00f0ff" font-weight="700">70% (Active)</text>
    </g>
  </g>

  <!-- Right Column (Topics 6 to 10) -->
  <g transform="translate(515, 55)" font-family="'Fira Code', monospace" font-size="12">
    <!-- Sorting -->
    <g transform="translate(0, 0)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">📊 Sorting</text>
      <rect x="130" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="130" y="4" width="126" height="14" rx="7" fill="url(#barBlue)"/>
      <text x="320" y="16" fill="#00f0ff" font-weight="700">70% (Active)</text>
    </g>

    <!-- Trees -->
    <g transform="translate(0, 32)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🌳 Trees</text>
      <rect x="130" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="130" y="4" width="126" height="14" rx="7" fill="url(#barBlue)"/>
      <text x="320" y="16" fill="#00f0ff" font-weight="700">70% (Active)</text>
    </g>

    <!-- Graphs -->
    <g transform="translate(0, 64)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🌐 Graphs</text>
      <rect x="130" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="130" y="4" width="90" height="14" rx="7" fill="url(#barOrange)"/>
      <text x="320" y="16" fill="#ffaa00" font-weight="700">50% (Building)</text>
    </g>

    <!-- AVL Trees -->
    <g transform="translate(0, 96)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🎄 AVL Trees</text>
      <rect x="130" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="130" y="4" width="90" height="14" rx="7" fill="url(#barOrange)"/>
      <text x="320" y="16" fill="#ffaa00" font-weight="700">50% (Building)</text>
    </g>

    <!-- Recursion -->
    <g transform="translate(0, 128)">
      <text x="0" y="16" fill="#f8fafc" font-weight="600">🔄 Recursion</text>
      <rect x="130" y="4" width="180" height="14" rx="7" fill="#1e293b"/>
      <rect x="130" y="4" width="90" height="14" rx="7" fill="url(#barOrange)"/>
      <text x="320" y="16" fill="#ffaa00" font-weight="700">50% (Building)</text>
    </g>
  </g>
</svg>

<svg fill="none" width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="innerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="300" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="35" y="45" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="20" font-weight="700">🚀 Featured Projects</text>
  <line x1="35" y1="58" x2="965" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- Project 1: Kabadiwala Connect -->
  <g transform="translate(35, 75)">
    <rect width="450" height="200" rx="14" fill="url(#innerCard)" stroke="#10b981" stroke-width="1.5"/>

    <!-- Title & Badge -->
    <text x="25" y="38" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="18" font-weight="800">♻️ Kabadiwala Connect</text>
    <rect x="330" y="20" width="95" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="377" y="36" fill="#34d399" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">WEB PLATFORM</text>

    <!-- Description Lines -->
    <text x="25" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" width="400">
      A technology-driven e-waste platform connecting
    </text>
    <text x="25" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">
      informal scrap collectors with authorized recyclers,
    </text>
    <text x="25" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">
      enabling digital lot creation &amp; price discovery.
    </text>

    <!-- Tech Stack Tags -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="35" y="15" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">E-Waste</text>
      <rect x="78" y="0" width="55" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="105" y="15" fill="#ffaa00" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">AI</text>
      <rect x="141" y="0" width="75" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="178" y="15" fill="#7000ff" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Full Stack</text>
      <rect x="224" y="0" width="135" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="291" y="15" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Product Engg</text>
    </g>

    <!-- Links Buttons -->
    <g transform="translate(25, 162)">
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#64748b"/>
      <text x="57" y="17" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">🔗 View Repo</text>
      <rect x="125" y="0" width="115" height="26" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="182" y="17" fill="#34d399" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">🌐 Live Demo</text>
    </g>
  </g>

  <!-- Project 2: Email Classifier -->
  <g transform="translate(515, 75)">
    <rect width="450" height="200" rx="14" fill="url(#innerCard)" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Title & Badge -->
    <text x="25" y="38" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="18" font-weight="800">📧 Email Classifier</text>
    <rect x="330" y="20" width="95" height="24" rx="12" fill="#0c4a6e" stroke="#00f0ff" stroke-width="1"/>
    <text x="377" y="36" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">PYTHON ML</text>

    <!-- Description Lines -->
    <text x="25" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">
      An intelligent email classification project focused
    </text>
    <text x="25" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">
      on automatically categorizing incoming messages
    </text>
    <text x="25" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">
      using machine-learning text classification.
    </text>

    <!-- Tech Stack Tags -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="60" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="30" y="15" fill="#ffaa00" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Python</text>
      <rect x="68" y="0" width="125" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="130" y="15" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Machine Learning</text>
      <rect x="201" y="0" width="45" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="223" y="15" fill="#ff007a" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">NLP</text>
      <rect x="254" y="0" width="105" height="22" rx="6" fill="#0f172a" stroke="#334155"/><text x="306" y="15" fill="#8b5cf6" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle">Classification</text>
    </g>

    <!-- Links Buttons -->
    <g transform="translate(25, 162)">
      <rect x="0" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#64748b"/>
      <text x="57" y="17" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">🔗 View Repo</text>
    </g>
  </g>
</svg>

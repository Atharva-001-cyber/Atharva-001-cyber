<svg fill="none" width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f0ff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyber Grid Lines overlay -->
  <path d="M0 40H1000 M0 90H1000 M0 140H1000 M0 190H1000 M0 240H1000" stroke="#1e293b" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <path d="M100 0V260 M250 0V260 M400 0V260 M550 0V260 M700 0V260 M850 0V260" stroke="#1e293b" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- 3D Java Cyber Shield Graphic -->
  <g transform="translate(45, 35)">
    <!-- Outer Glow Circle -->
    <circle cx="95" cy="95" r="85" fill="#0d1527" stroke="#00f0ff" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="95" cy="95" r="75" fill="none" stroke="#7000ff" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- 3D Java Coffee Cup Icon -->
    <path d="M75 135 C 75 145, 115 145, 115 135 L 120 90 C 120 75, 70 75, 70 90 Z" fill="url(#javaGrad)" filter="url(#glow)"/>
    <path d="M120 95 C 135 95, 135 115, 120 115" stroke="#ffaa00" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Steam Lines -->
    <path d="M80 68 C 85 55, 75 45, 82 35" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <path d="M95 65 C 100 50, 90 40, 97 30" stroke="#ff007a" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <path d="M110 68 C 115 55, 105 45, 112 35" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  </g>

  <!-- Title Text Area -->
  <g transform="translate(260, 50)">
    <!-- Subtitle Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0f172a" stroke="#00f0ff" stroke-width="1.2"/>
    <text x="110" y="18" fill="#00f0ff" font-family="'Fira Code', monospace, sans-serif" font-size="12" font-weight="700" text-anchor="middle">👋 WELCOME TO MY REPO</text>

    <!-- Main Name Title -->
    <text x="0" y="75" fill="url(#textGrad)" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#shadow)">Atharva Ranjan Soni</text>

    <!-- Roles Tagline -->
    <text x="0" y="112" fill="#cbd5e1" font-family="'Fira Code', monospace, sans-serif" font-size="16" font-weight="600">
      <tspan fill="#ffaa00">JAVA DEVELOPER</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#00f0ff">DSA ENTHUSIAST</tspan>
      <tspan fill="#64748b"> | </tspan>
      <tspan fill="#ff007a">BUILDING REAL SOLUTIONS</tspan>
    </text>

    <!-- College Tag & Bio snippet -->
    <rect x="0" y="135" width="460" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="15" y="157" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">
      🎓 <tspan fill="#f8fafc" font-weight="600">B.Tech 3rd Year</tspan> @ Shri Ramswaroop Memorial College
    </text>

    <!-- Quick Status Pill -->
    <rect x="475" y="135" width="200" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="492" cy="152" r="4" fill="#10b981" filter="url(#glow)"/>
    <text x="505" y="157" fill="#10b981" font-family="'Fira Code', monospace" font-size="12" font-weight="600">Building Software 🚀</text>
  </g>
</svg>
